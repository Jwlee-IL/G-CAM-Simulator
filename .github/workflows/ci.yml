name: CI

on:
  push:
    branches: [MainRoot]
  pull_request:
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET build + tests
    # The WPF viewers (Gcam.Wpf, Gcam.Studio) and the UI-oracle tests target net9.0-windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build Gcam.sln -c Release
      - name: Test
        # Engine physics invariants, Studio ViewModels and UI oracles. The desktop UI scenarios
        # skip themselves unless GCAM_UI_TESTS=1 (they need an interactive session).
        run: dotnet test Gcam.sln -c Release --no-build --logger "console;verbosity=normal"
      - name: Note the skipped desktop UI scenarios
        if: always()
        shell: pwsh
        run: |
          "The 7 desktop UI scenarios (tests/Gcam.Studio.UiTests) need an interactive session and are SKIPPED here," >> $env:GITHUB_STEP_SUMMARY
          "not passed. Run them locally with GCAM_UI_TESTS=1 (docs/AGENTS.UiAutomation.md)." >> $env:GITHUB_STEP_SUMMARY

  rtl:
    name: RTL cocotb (Icarus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Icarus Verilog + cocotb
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install cocotb==2.0.1
      - name: Run cocotb (RTL vs the integer reference shared with the C# Waveform)
        run: python rtl/run_cocotb.py
